name: Build and Push Server Image

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Steam build ID (e.g. 16384556)"
        required: true
        type: string
      build_date:
        description: "Build date in YYYY.MM.DD format"
        required: true
        type: string

permissions:
  packages: write
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: payback159/enshrouded-server

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          # Remove pre-installed software that we don't need to make room for the ~8 GB image
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./container
          file: ./container/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.build_date }}-build${{ inputs.build_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=Enshrouded Dedicated Server
            org.opencontainers.image.description=Enshrouded Dedicated Server containerized with GE-Proton
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ inputs.build_date }}
            com.enshrouded.steam.build-id=${{ inputs.build_id }}


