name: Check Steam Update

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query current Steam build ID for Enshrouded Dedicated Server
        id: steam
        run: |
          # Download steamcmd directly (avoids Docker pull overhead / rate limits)
          mkdir -p /tmp/steamcmd
          curl -sqL "https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz" \
            | tar xzf - -C /tmp/steamcmd

          echo "Triggering App-Info-Update on Steam..."
          # 1. Call: Trigger update so that the Steam Connection Manager requests the data from the Steam servers and updates the local cache
          /tmp/steamcmd/steamcmd.sh +login anonymous +app_info_update 1 +quit

          # wait 5 seconds to give steamcmd some time to fetch the latest data before we query it again 
          sleep 5

          echo "Querying current build ID..."
          # 2. Call: Now read the freshly synchronized data and extract the build ID for our app (2278520 = Enshrouded Dedicated Server)
          OUTPUT=$(/tmp/steamcmd/steamcmd.sh \
            +login anonymous \
            +app_info_print 2278520 \
            +quit 2>&1 || true)

          BUILD_ID=$(echo "$OUTPUT" \
            | grep '"buildid"' \
            | awk '{print $2}' \
            | tr -d '"')

          if [ -z "$BUILD_ID" ]; then
            echo "ERROR: Could not extract build ID from steamcmd output" >&2
            echo "--- last 50 lines ---" >&2
            echo "$OUTPUT" | tail -50 >&2
            exit 1
          fi

          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "Detected Steam build ID: $BUILD_ID"

      - name: Read build ID from latest image label
        id: last
        run: |
          # Read the com.enshrouded.steam.build-id label from the :latest image.
          # Falls back to "0" if the image does not exist yet (first ever build).
          LAST_ID=$(skopeo inspect \
            docker://ghcr.io/payback159/enshrouded-server:latest \
            --format '{{index .Labels "com.enshrouded.steam.build-id"}}' \
            2>/dev/null || echo "0")
          LAST_ID=${LAST_ID:-0}
          echo "last_id=$LAST_ID" >> "$GITHUB_OUTPUT"
          echo "Last known build ID (from image label): $LAST_ID"

      - name: Trigger image build if build ID changed
        if: steps.steam.outputs.build_id != steps.last.outputs.last_id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD_DATE=$(date -u +"%Y.%m.%d")
          echo "New build detected: ${{ steps.last.outputs.last_id }} -> ${{ steps.steam.outputs.build_id }}"
          gh workflow run build-push-image.yml \
            --repo "${{ github.repository }}" \
            --field build_id=${{ steps.steam.outputs.build_id }} \
            --field build_date=${BUILD_DATE}

      - name: No update available
        if: steps.steam.outputs.build_id == steps.last.outputs.last_id
        run: echo "Already on latest build ID ${{ steps.steam.outputs.build_id }}, skipping build."